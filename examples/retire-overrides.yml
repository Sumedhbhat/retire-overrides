# .github/workflows/retire-overrides.yml — the only file a repository needs.
# Pin a release tag (vX.Y.Z) or a release line branch (release/X.Y).
name: retire-overrides

on:
  schedule:
    - cron: "23 5 * * *" # daily
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/npm-shrinkwrap.json"
      - "**/pnpm-lock.yaml"
      - "**/pnpm-workspace.yaml"
      - "**/bun.lock"
      - ".github/retire-overrides.yml"
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/npm-shrinkwrap.json"
      - "**/pnpm-lock.yaml"
      - "**/pnpm-workspace.yaml"
      - "**/bun.lock"
      - ".github/retire-overrides.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire-overrides:
    runs-on: ubuntu-latest
    concurrency: retire-overrides # one run at a time
    steps:
      - uses: Sumedhbhat/retire-overrides@v0.3.0
        with:
          token: ${{ secrets.RETIRE_OVERRIDES_TOKEN }}
          # bun-version: 1.3.0   # Bun projects: the version your CI uses
          # uv-version: 0.13.0    # uv projects: the version your CI uses
